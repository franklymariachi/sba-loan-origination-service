version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: loanbud-postgres
    environment:
      POSTGRES_DB: loanbud_db
      POSTGRES_USER: loanbud
      POSTGRES_PASSWORD: loanbud123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: